<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git team collaboration &mdash; phases 1 and 2</title>
<style>
  :root {
    --ink: #101418;
    --ink-2: #1a1f26;
    --rule: #2b323c;
    --paper: #fffce8;
    --text: #e8e6dd;
    --muted: #8d97a5;
    --live: #7fb3a0;
    --fade: 420ms;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 22px 10px; border-bottom: 1px solid var(--rule); flex: none;
  }
  .phase-pill {
    font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink); background: var(--live); border-radius: 3px; padding: 3px 8px;
  }
  .deck-title {
    font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }
  .counter {
    margin-left: auto;
    font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace;
    font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .counter b { color: var(--text); font-weight: 600; }

  .progress { display: flex; gap: 4px; flex: none; padding: 0 22px; }
  .seg { height: 3px; flex: 1; background: var(--rule); border-radius: 2px;
         position: relative; overflow: hidden; }
  .seg.done { background: #46525f; }
  .seg.live::after {
    content: ""; position: absolute; inset: 0; background: var(--live);
    transform-origin: left; animation: seg-fill 900ms ease-out forwards;
  }
  @keyframes seg-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  .stage { flex: 1; min-height: 0; padding: 14px 22px; display: flex; cursor: pointer; }
  .paper {
    flex: 1; min-height: 0; background: var(--paper); border-radius: 6px; padding: 6px;
    box-shadow: 0 18px 50px rgba(0,0,0,.45); position: relative;
  }
  .board { position: absolute; inset: 6px; width: auto; height: auto; }
  .board[hidden] { display: none; }

  footer {
    flex: none; border-top: 1px solid var(--rule); padding: 11px 22px 14px;
    display: grid; grid-template-columns: minmax(280px, 46%) 1fr; gap: 24px; align-items: start;
  }
  .eyebrow {
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--live); font-weight: 700; margin-bottom: 5px;
  }
  .caption { font-size: 15px; line-height: 1.5; margin: 0; max-width: 68ch; }
  .term {
    background: var(--ink-2); border: 1px solid var(--rule); border-radius: 5px;
    padding: 9px 14px; min-height: 44px;
    font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace;
    font-size: 14px; line-height: 1.7; color: #d6e7de;
  }
  .term .line { display: block; white-space: nowrap; overflow: hidden;
                animation: type-in 260ms ease-out both; }
  .term .line::before { content: "$ "; color: var(--muted); }
  .term .line.note { color: var(--muted); font-style: italic; }
  .term .line.note::before { content: ""; }
  .term.empty::after { content: "\2014"; color: var(--muted); }
  @keyframes type-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  .controls { display: flex; gap: 8px; align-items: center; }
  button {
    font: inherit; font-size: 13px; color: var(--text); background: var(--ink-2);
    border: 1px solid var(--rule); border-radius: 5px; padding: 5px 11px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #4d5a68; }
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible, .stage:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
  .hint { font-size: 12px; color: var(--muted); margin-left: 4px; }

  .el { opacity: 0; }
  .el.shown { opacity: 1; }

  @media (max-width: 900px) {
    footer { grid-template-columns: 1fr; gap: 10px; }
    .caption { font-size: 13.5px; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .seg.live::after { animation: none; transform: none; }
    .term .line { animation: none; }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  var COPY = {"1-0": {"eyebrow": "Before anyone types anything", "title": "GitHub, the person who owns the repo, and two developers with empty laptops.", "cmd": []}, "1-1": {"eyebrow": "Step 1 · Repo owner", "title": "Create the repository, lock main so nothing lands on it directly, and add both developers as collaborators.", "cmd": ["git init"]}, "1-2": {"eyebrow": "Step 2 · Both developers", "title": "Clone the repo. This creates the project folder on disk and records GitHub as the remote named origin.", "cmd": ["git clone https://github.com/username/reponame"]}, "1-3": {"eyebrow": "Step 3 · DeveloperA", "title": "Branch off main to start the home-page feature, then switch onto that branch.", "cmd": ["git branch home-page", "git checkout home-page"]}, "1-4": {"eyebrow": "Step 4 · DeveloperA", "title": "Push the branch. home-page now exists on GitHub as well as locally; -u links the two so later pushes need no arguments.", "cmd": ["git push -u origin home-page"]}, "1-5": {"eyebrow": "Step 5 · DeveloperB", "title": "Same move, different feature: branch posts-page off main and switch onto it.", "cmd": ["git branch posts-page", "git checkout posts-page"]}, "1-6": {"eyebrow": "Step 6 · DeveloperB", "title": "Push posts-page. Both features are now on GitHub, side by side, and main is untouched.", "cmd": ["git push -u origin posts-page"]}, "2-0": {"eyebrow": "Where phase 1 left off", "title": "Both features are built and both branches exist locally and on GitHub. Nothing has been merged into main yet.", "cmd": []}, "2-1": {"eyebrow": "Step 1 · DeveloperA", "title": "Switch to the feature branch and pull main into it. Pull is two operations: fetch moves GitHub's main into origin/main, then merge brings those commits into home-page. Nobody has merged anything yet, so there is nothing to reconcile.", "cmd": ["git checkout home-page", "git pull origin main"]}, "2-2": {"eyebrow": "Step 2 · DeveloperA", "title": "Push the updated branch. Plain git push works here because phase 1 already set the upstream.", "cmd": ["git push origin home-page"]}, "2-3": {"eyebrow": "Step 3 · DeveloperA", "title": "Open a pull request proposing home-page be merged into main. This happens in the browser, not the terminal.", "cmd": ["# github.com → New pull request → home-page into main"]}, "2-4": {"eyebrow": "Step 4 · Repo owner", "title": "Review and merge the pull request. GitHub's main now contains the home-page feature — which means main has moved.", "cmd": ["# github.com → Merge pull request"]}, "2-5": {"eyebrow": "Step 5 · DeveloperB", "title": "The same two commands DeveloperA ran. The difference is timing: main now carries DeveloperA's work, so this pull actually brings changes down.", "cmd": ["git checkout posts-page", "git pull origin main"]}, "2-6": {"eyebrow": "Step 6 · DeveloperB", "title": "The incoming changes touch lines DeveloperB also edited, so the merge stops and marks the conflicts. Resolve them in a merge tool. This happens on the feature branch — main is never at risk.", "cmd": ["# resolve the marked files in your merge tool"]}, "2-7": {"eyebrow": "Step 7 · DeveloperB", "title": "Stage the resolved files and commit the merge. posts-page now contains its own work plus everything from main.", "cmd": ["git add .", "git commit -m \"main merged into feature\""]}, "2-8": {"eyebrow": "Step 8 · DeveloperB", "title": "Push the reconciled branch to GitHub.", "cmd": ["git push origin posts-page"]}, "2-9": {"eyebrow": "Step 9 · DeveloperB", "title": "Open a pull request for posts-page. Because the conflict is already resolved, this one merges cleanly.", "cmd": ["# github.com → New pull request → posts-page into main"]}, "2-10": {"eyebrow": "Step 10 · Repo owner", "title": "Merge it. main now holds both features, and every conflict was settled on a branch before it ever reached main.", "cmd": ["# github.com → Merge pull request"]}};
  var LAST = { 1: 6, 2: 10 };
  var LABEL = { 1: "Starting the work", 2: "Sharing the work" };
  var FADE = 420;

  var boards = { 1: document.getElementById("svg1"), 2: document.getElementById("svg2") };
  var els = {
    1: Array.prototype.slice.call(boards[1].querySelectorAll(".el")),
    2: Array.prototype.slice.call(boards[2].querySelectorAll(".el"))
  };
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var timers = [];
  var phase = 1, step = 0;

  /* Split each drawn arrow into shaft (the long stroke) and head (the short

     both boards are still rendered - getTotalLength needs layout. */
  [1, 2].forEach(function (p) {
    els[p].forEach(function (g) {
      if (!g.hasAttribute("data-draw")) return;
      var paths = Array.prototype.slice.call(g.querySelectorAll("path"))
        .filter(function (n) { return n.getAttribute("stroke") !== "none"; });
      var lens = paths.map(function (n) {
        try { return n.getTotalLength(); } catch (e) { return 0; }
      });
      var max = Math.max.apply(null, lens.concat([1]));
      g._shaft = []; g._head = [];
      paths.forEach(function (n, i) {
        if (lens[i] >= max * 0.45) {
          n.style.strokeDasharray = lens[i];
          n.style.strokeDashoffset = lens[i];
          n._len = lens[i];
          g._shaft.push(n);
        } else {
          n.style.opacity = 0;
          g._head.push(n);
        }

      g._dur = Math.min(900, Math.max(360, max * 0.85));

  });

  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function hide(g) {
    g.style.transition = "none";
    g.classList.remove("shown");
    if (g._shaft) {
      g._shaft.forEach(function (n) { n.style.transition = "none"; n.style.strokeDashoffset = n._len; });
      g._head.forEach(function (n) { n.style.transition = "none"; n.style.opacity = 0; });
    }
  }

  function showInstant(g) {
    g.style.transition = "none";
    g.classList.add("shown");
    if (g._shaft) {
      g._shaft.forEach(function (n) { n.style.transition = "none"; n.style.strokeDashoffset = 0; });
      g._head.forEach(function (n) { n.style.transition = "none"; n.style.opacity = 1; });
    }
  }

  function reveal(g) {
    if (g._shaft) {
      g.classList.add("shown");
      g.style.transition = "none";
      g._shaft.forEach(function (n) {
        n.style.transition = "stroke-dashoffset " + g._dur + "ms cubic-bezier(.4,.05,.35,1)";
        n.style.strokeDashoffset = 0;
      });
      g._head.forEach(function (n) {
        n.style.transition = "opacity 180ms ease-out " + Math.round(g._dur * 0.8) + "ms";
        n.style.opacity = 1;
      });
    } else {
      g.style.transition = "opacity " + FADE + "ms ease-out";
      g.classList.add("shown");
    }
  }

  function render(p, s, animate) {
    clearTimers();
    phase = p;
    step = Math.max(0, Math.min(LAST[p], s));

    boards[1].hidden = phase !== 1;
    boards[2].hidden = phase !== 2;

    var other = phase === 1 ? 2 : 1;
    els[other].forEach(hide);

    var arriving = [];
    els[phase].forEach(function (g) {
      var gs = +g.dataset.step;
      if (gs > step) { hide(g); }
      else if (gs < step || !animate || reduced) { showInstant(g); }
      else { hide(g); arriving.push(g); }
    });

    if (arriving.length) {
      void boards[phase].getBoundingClientRect();   // make the reset stick
      var beats = {};
      arriving.forEach(function (g) {
        (beats[g.dataset.beat] = beats[g.dataset.beat] || []).push(g);
      });
      var acc = 0;
      Object.keys(beats).sort().forEach(function (b) {

        group.forEach(function (g) { if (g._dur) dur = Math.max(dur, g._dur); });

        acc += Math.round(dur * 0.62) + 90;

  }

  function paint() {
    var copy = COPY[phase + "-" + step];
    document.getElementById("pill").textContent = "Phase " + phase;
    document.getElementById("deck-title").textContent = LABEL[phase];
    document.getElementById("cur").textContent = step;
    document.getElementById("tot").textContent = LAST[phase];
    document.getElementById("eyebrow").textContent = copy.eyebrow;
    document.getElementById("caption").textContent = copy.title;

    var term = document.getElementById("term");
    term.textContent = "";
    term.classList.toggle("empty", copy.cmd.length === 0);
    copy.cmd.forEach(function (line, i) {
      var el = document.createElement("span");
      el.className = "line" + (line.charAt(0) === "#" ? " note" : "");
      el.textContent = line.charAt(0) === "#" ? line.slice(1).trim() : line;
      el.style.animationDelay = (i * 140) + "ms";
      term.appendChild(el);

    if (prog.children.length !== LAST[phase]) {
      prog.textContent = "";
      for (var k = 0; k < LAST[phase]; k++) {
        prog.appendChild(document.createElement("div")).className = "seg";
      }

    var bars = prog.children;
    for (var i = 0; i < bars.length; i++) {
      bars[i].className = "seg" + (i + 1 < step ? " done" : i + 1 === step ? " done live" : "");

    document.getElementById("next").disabled = (phase === 2 && step === LAST[2]);

  function next() {
    if (step < LAST[phase]) { render(phase, step + 1, true); }

      case "ArrowRight": case " ": case "PageDown": case "Enter": next(); break;
      case "ArrowLeft": case "PageUp": case "Backspace": prev(); break;
      case "Home": render(phase, 0, false); break;
      case "End": render(phase, LAST[phase], false); break;
      case "1": render(1, 0, false); break;
      case "2": render(2, 0, false); break;
      case "r": case "R": render(phase, step, true); break;
      case "f": case "F":
        if (document.fullscreenElement) { document.exitFullscreen(); }
        else { document.documentElement.requestFullscreen(); }
        break;
      default: return;
    }
    e.preventDefault();
  });

  render(1, 0, false);
})();
</script>
</body>
</html>
